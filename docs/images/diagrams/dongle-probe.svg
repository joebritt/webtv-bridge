<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 512" role="img" aria-label="After a reset the ROM probes for its dongle; the Bridge mirrors D0-D3" font-size="13"><rect x="0" y="0" width="760" height="512" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">After a reset the ROM probes for its dongle; the Bridge mirrors D0-D3</text><g><text x="24" y="82" font-size="11.5" fill="#1f2328">four control lines</text><text x="24" y="122" font-size="11.5" fill="#1f2328">box drives the bus</text><text x="24" y="166" font-size="11.5" fill="#1f2328">D0-D7 (box)</text><text x="24" y="218" font-size="11.5" fill="#1f2328">nAck = D0</text><text x="24" y="254" font-size="11.5" fill="#1f2328">Busy = D1</text><text x="24" y="290" font-size="11.5" fill="#1f2328">PError = D2</text><text x="24" y="326" font-size="11.5" fill="#1f2328">nFault, Select = D3</text></g><g><path d="M196 68H736V68" fill="none" stroke="#1f2328" stroke-width="1.5"/><path d="M196 128H260V108H736V108" fill="none" stroke="#1f2328" stroke-width="1.5"/><path d="M196 162L201 152H255L260 162L255 172H201Z" fill="none" fill-opacity="1" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="3 3"/><path d="M260 162L265 152H365L370 162L365 172H265Z" fill="#2f6fdb" fill-opacity="0.14" stroke="#2f6fdb" stroke-width="1.25" stroke-dasharray="none"/><path d="M370 162L375 152H475L480 162L475 172H375Z" fill="#2f6fdb" fill-opacity="0.14" stroke="#2f6fdb" stroke-width="1.25" stroke-dasharray="none"/><path d="M480 162L485 152H585L590 162L585 172H485Z" fill="#2f6fdb" fill-opacity="0.14" stroke="#2f6fdb" stroke-width="1.25" stroke-dasharray="none"/><path d="M590 162L595 152H731L736 162L731 172H595Z" fill="#2f6fdb" fill-opacity="0.14" stroke="#2f6fdb" stroke-width="1.25" stroke-dasharray="none"/><text x="228" y="166" font-size="11.5" text-anchor="middle" fill="#59636e">FF</text><text x="315" y="166" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">F1</text><text x="425" y="166" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">F2</text><text x="535" y="166" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">F4</text><text x="663" y="166" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">F8 (stays)</text></g><g><path d="M196 204H268V204H378V224H488V224H598V224H736V224" fill="none" stroke="#c4570f" stroke-width="1.5"/><path d="M196 240H268V260H378V240H488V260H598V260H736V260" fill="none" stroke="#c4570f" stroke-width="1.5"/><path d="M196 276H268V296H378V296H488V276H598V296H736V296" fill="none" stroke="#c4570f" stroke-width="1.5"/><path d="M196 312H268V332H378V332H488V332H598V312H736V312" fill="none" stroke="#c4570f" stroke-width="1.5"/></g><g><line x1="348" x2="348" y1="182" y2="336" stroke="#2f6fdb" stroke-width="1" stroke-dasharray="3 3"/><line x1="458" x2="458" y1="182" y2="336" stroke="#2f6fdb" stroke-width="1" stroke-dasharray="3 3"/><line x1="568" x2="568" y1="182" y2="336" stroke="#2f6fdb" stroke-width="1" stroke-dasharray="3 3"/><line x1="716" x2="716" y1="182" y2="336" stroke="#2f6fdb" stroke-width="1" stroke-dasharray="3 3"/><text x="348" y="352" text-anchor="middle" font-size="11" fill="#59636e">STAT read</text><text x="458" y="352" text-anchor="middle" font-size="11" fill="#59636e">STAT read</text><text x="568" y="352" text-anchor="middle" font-size="11" fill="#59636e">STAT read</text><text x="716" y="352" text-anchor="middle" font-size="11" fill="#59636e">STAT read</text></g><g><text x="24" y="388" font-size="12" fill="#1f2328">1  After every reset the boot ROM turns its bus out and drives F1, F2, F4, F8, reading STAT a 50-pass</text><text x="40" y="406" font-size="12" fill="#1f2328">delay loop (about 150 instructions) after each write.</text><text x="24" y="428" font-size="12" fill="#1f2328">2  The Bridge copies D0-D3 onto its status lines (the lower four) within one loop pass, well under 1 us.</text><text x="24" y="450" font-size="12" fill="#1f2328">3  All four match: Dongle Attached, diagnostics on the parallel port. A mismatch at F1: the ROM stops</text><text x="40" y="468" font-size="12" fill="#1f2328">and boots the OS (how the Bridge lets boot_ram start the patched OS: it does not mirror that reset).</text><text x="24" y="490" font-size="12" fill="#1f2328">4  The ROM leaves F8 on the bus through the diagnostics. Timing not to scale.</text></g></svg>
