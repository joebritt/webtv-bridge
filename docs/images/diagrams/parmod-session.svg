<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 500" role="img" aria-label="A PARMOD session: entry, then bursts the bridge asks for with nAck" font-size="13"><rect x="0" y="0" width="760" height="500" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">A PARMOD session: entry, then bursts the bridge asks for with nAck</text><defs><marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><g><rect x="80" y="44" width="140" height="26" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><rect x="540" y="44" width="140" height="26" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="150" y="61" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Box (loader or OS)</text><text x="610" y="61" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Bridge (Pico)</text><line x1="150" x2="150" y1="70" y2="432" stroke="#d0d7de"/><line x1="610" x2="610" y1="70" y2="432" stroke="#d0d7de"/></g><g><path d="M156 98H604" stroke="#8c959f" stroke-width="1.25" fill="none" marker-end="url(#s-arrow)"/><text x="380" y="92" font-size="12" text-anchor="middle" fill="#1f2328">CTRL_OUT  'L' 'P' 'T' '2'</text><text x="380" y="112" font-size="11" text-anchor="middle" fill="#59636e">each byte taken: Select high</text><path d="M604 140H156" stroke="#8c959f" stroke-width="1.25" fill="none" marker-end="url(#s-arrow)"/><text x="380" y="134" font-size="12" text-anchor="middle" fill="#1f2328">CTRL_IN  version 2 (a reply: Select high)</text><text x="380" y="154" font-size="11" text-anchor="middle" fill="#59636e">no answer within 1 ms (still the dongle): start again</text></g><g><path d="M604 188H156" stroke="#8c959f" stroke-width="1.25" fill="none" marker-end="url(#s-arrow)" stroke-dasharray="4 3"/><text x="380" y="182" font-size="12" text-anchor="middle" fill="#1f2328">nFault low, then an nAck pulse: the box port interrupt</text><text x="380" y="202" font-size="11" text-anchor="middle" fill="#59636e">something for the box: modem data from WiFi, console input, a reply</text></g><g><path d="M604 232H156" stroke="#8c959f" stroke-width="1.25" fill="none" marker-end="url(#s-arrow)"/><text x="380" y="226" font-size="12" text-anchor="middle" fill="#1f2328">MODEM_IN  byte, byte, ... until Select low</text><text x="380" y="246" font-size="11" text-anchor="middle" fill="#59636e">Select low: the status byte (modem, con-in, reply, carrier, mfull)</text><path d="M156 276H604" stroke="#8c959f" stroke-width="1.25" fill="none" marker-end="url(#s-arrow)"/><text x="380" y="270" font-size="12" text-anchor="middle" fill="#1f2328">MODEM_OUT  byte, byte, ... until refused</text><text x="380" y="290" font-size="11" text-anchor="middle" fill="#59636e">refused: the ring is full (mfull); an nAck when there is room</text><path d="M156 316H604" stroke="#8c959f" stroke-width="1.25" fill="none" marker-end="url(#s-arrow)"/><text x="380" y="310" font-size="12" text-anchor="middle" fill="#1f2328">CON_OUT  console text (never refused; dropped when 4 KB are full)</text><path d="M156 352H604" stroke="#8c959f" stroke-width="1.25" fill="none" marker-end="url(#s-arrow)"/><text x="380" y="346" font-size="12" text-anchor="middle" fill="#1f2328">CTRL_OUT  a command: DTR_ON, DTR_OFF, MODEM_RESET, REBOOT, EXIT</text><path d="M156 388H604" stroke="#8c959f" stroke-width="1.25" fill="none" marker-end="url(#s-arrow)" stroke-dasharray="4 3"/><text x="380" y="382" font-size="12" text-anchor="middle" fill="#1f2328">IDLE  0xFF on the bus, then code 111: never looks like the probe</text></g><text x="24" y="462" font-size="12" fill="#1f2328">The loader's protocol rides the modem channel the same way (its commands in, its replies out); after</text><text x="24" y="480" font-size="12" fill="#1f2328">boot_ram the Bridge enters PARMOD afresh and the OS opens its own session.</text></svg>
