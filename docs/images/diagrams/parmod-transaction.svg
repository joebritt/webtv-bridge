<svg xmlns="http://www.w3.org/2000/svg" width="760" height="526" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 526" role="img" aria-label="A PARMOD transaction: code, strobe, answer, release" font-size="13"><rect x="0" y="0" width="760" height="526" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">A PARMOD transaction: code, strobe, answer, release</text><g><text x="24" y="86" font-size="11.5" fill="#1f2328">code (nSelIn nInit nAutoFd)</text><text x="24" y="132" font-size="11.5" fill="#1f2328">D0-D7</text><text x="24" y="180" font-size="11.5" fill="#1f2328">nStrobe (box)</text><text x="24" y="218" font-size="11.5" fill="#1f2328">Busy (Bridge)</text><text x="24" y="256" font-size="11.5" fill="#1f2328">Select (Bridge)</text></g><g><path d="M196 82L201 72H231L236 82L231 92H201Z" fill="none" fill-opacity="1" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="none"/><path d="M236 82L241 72H441L446 82L441 92H241Z" fill="#2f6fdb" fill-opacity="0.14" stroke="#2f6fdb" stroke-width="1.25" stroke-dasharray="none"/><path d="M446 82L451 72H651L656 82L651 92H451Z" fill="#2f6fdb" fill-opacity="0.14" stroke="#2f6fdb" stroke-width="1.25" stroke-dasharray="none"/><path d="M656 82L661 72H731L736 82L731 92H661Z" fill="none" fill-opacity="1" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="none"/><text x="216" y="86" font-size="11" text-anchor="middle" fill="#59636e">111</text><text x="341" y="86" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">MODEM_OUT 011 (bus out)</text><text x="551" y="86" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">MODEM_IN 010 (bus in)</text><text x="696" y="86" font-size="11" text-anchor="middle" fill="#59636e">IDLE 111</text></g><g><path d="M196 128L201 118H231L236 128L231 138H201Z" fill="none" fill-opacity="1" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="3 3"/><path d="M236 128L241 118H347L352 128L347 138H241Z" fill="#2f6fdb" fill-opacity="0.14" stroke="#2f6fdb" stroke-width="1.25" stroke-dasharray="none"/><path d="M352 128L357 118H367L372 128L367 138H357Z" fill="none" fill-opacity="1" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="3 3"/><path d="M372 128L377 118H481L486 128L481 138H377Z" fill="none" fill-opacity="1" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="3 3"/><path d="M486 128L491 118H573L578 128L573 138H491Z" fill="#c4570f" fill-opacity="0.14" stroke="#c4570f" stroke-width="1.25" stroke-dasharray="none"/><path d="M578 128L583 118H595L600 128L595 138H583Z" fill="#c4570f" fill-opacity="0.14" stroke="#c4570f" stroke-width="1.25" stroke-dasharray="none"/><path d="M600 128L605 118H731L736 128L731 138H605Z" fill="none" fill-opacity="1" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="3 3"/><text x="294" y="132" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">byte (box)</text><text x="362" y="112" font-size="10.5" text-anchor="middle" fill="#59636e">FF</text><text x="429" y="132" font-size="11" text-anchor="middle" fill="#59636e">released</text><text x="532" y="132" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">byte (Bridge)</text><text x="589" y="112" font-size="10.5" text-anchor="middle" fill="#59636e">FF</text><text x="668" y="132" font-size="11" text-anchor="middle" fill="#59636e">released (pull-ups: FF)</text></g><g><path d="M196 166H266V186H330V166H476V186H570V166H736V166" fill="none" stroke="#1f2328" stroke-width="1.5"/><path d="M196 224H280V204H344V224H496V204H596V224H736V224" fill="none" stroke="#c4570f" stroke-width="1.5"/><path d="M196 262H276V242H344V262H492V242H596V262H736V262" fill="none" stroke="#c4570f" stroke-width="1.5"/></g><g><circle cx="236" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="236" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">1</text><circle cx="266" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="266" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">2</text><circle cx="288" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="288" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">3</text><circle cx="330" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="330" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">4</text><circle cx="354" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="354" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">5</text><circle cx="446" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="446" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">1</text><circle cx="476" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="476" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">2</text><circle cx="502" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="502" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">3</text><circle cx="570" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="570" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">4</text><circle cx="598" cy="292" r="9" fill="none" stroke="#2f6fdb" stroke-width="1.25"/><text x="598" y="296" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">5</text></g><g><text x="24" y="336" font-size="12" fill="#1f2328">1  The box puts the code on nSelectIn, nInit, nAutoFd (for an _OUT, its byte on the bus too); it settles.</text><text x="24" y="358" font-size="12" fill="#1f2328">2  nStrobe low. The Bridge sees the edge within one loop pass and samples the bus 100 ns later.</text><text x="24" y="380" font-size="12" fill="#1f2328">3  The Bridge answers: Select, then Busy high. _OUT: Select high = taken, low = refused (ring full).</text><text x="40" y="398" font-size="12" fill="#1f2328">_IN: it drives its byte first; Select high = a byte, low = the status byte (nothing to give).</text><text x="24" y="420" font-size="12" fill="#1f2328">4  The box reads Select (and for an _IN the byte), then raises nStrobe.</text><text x="24" y="442" font-size="12" fill="#1f2328">5  The Bridge puts 0xFF on the bus, lets go and drops Busy. The box drives 0xFF before going IDLE</text><text x="40" y="460" font-size="12" fill="#1f2328">(the loader after every send), so a released bus never shows a probe byte beside code 111.</text><text x="24" y="482" font-size="12" fill="#1f2328">Codes: CTRL_OUT 101, CTRL_IN 100, MODEM_OUT 011, MODEM_IN 010, CON_OUT 001, CON_IN 110, IDLE 111.</text><text x="24" y="504" font-size="12" fill="#59636e">Not to scale. On the real cable lptscope.py measures each step.</text></g></svg>
