<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 476" role="img" aria-label="The phases of the start-up" font-size="13"><rect x="0" y="0" width="760" height="476" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Power-on to the service in under a minute, the OS untouched on the disk</text><defs><marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M244 102H266" marker-end="url(#p-arrow)"/><path d="M490 102H512" marker-end="url(#p-arrow)"/><path d="M626 148V166H134V180" marker-end="url(#p-arrow)"/><path d="M244 230H266" marker-end="url(#p-arrow)"/><path d="M490 230H512" marker-end="url(#p-arrow)"/><path d="M626 276V294H134V308" marker-end="url(#p-arrow)"/><path d="M244 358H266" marker-end="url(#p-arrow)"/><path d="M490 358H512" marker-end="url(#p-arrow)"/></g><g><rect x="24" y="56" width="220" height="92" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="78" font-size="13" font-weight="600" fill="#1f2328">0 s  Probe, diagnostics</text><text x="36" y="95" font-size="11.5" fill="#1f2328">mirror answers: Dongle Attached</text><text x="36" y="112" font-size="11.5" fill="#59636e">18 (debug ROM) or 19 (tier 3)</text><text x="36" y="129" font-size="11.5" fill="#59636e">stage 0 typed at 19200</text></g><g><rect x="270" y="56" width="220" height="92" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/><text x="282" y="78" font-size="13" font-weight="600" fill="#1f2328">5.9 s  Loader running</text><text x="282" y="95" font-size="11.5" fill="#1f2328">PARMOD session, protocol on</text><text x="282" y="112" font-size="11.5" fill="#59636e">the modem channel</text><text x="282" y="129" font-size="11.5" fill="#59636e">2046 via tier 3: 2.5 s</text></g><g><rect x="516" y="56" width="220" height="92" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="528" y="78" font-size="13" font-weight="600" fill="#1f2328">5.9-19.8 s  WiFi setup</text><text x="528" y="95" font-size="11.5" fill="#1f2328">scan, password, join</text><text x="528" y="112" font-size="11.5" fill="#59636e">first time only</text><text x="528" y="129" font-size="11.5" fill="#59636e">IR keyboard or the remote</text></g><g><rect x="24" y="184" width="220" height="92" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="206" font-size="13" font-weight="600" fill="#1f2328">20.5 s  Read and patch</text><text x="36" y="223" font-size="11.5" fill="#1f2328">OS slot into RAM, checked</text><text x="36" y="240" font-size="11.5" fill="#59636e">patched from the table</text><text x="36" y="257" font-size="11.5" fill="#59636e">0.2 s for 2.8 MB</text></g><g><rect x="270" y="184" width="220" height="92" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="282" y="206" font-size="13" font-weight="600" fill="#1f2328">21.6 s  Countdown menu</text><text x="282" y="223" font-size="11.5" fill="#1f2328">Start, Save, Install, Settings</text><text x="282" y="240" font-size="11.5" fill="#59636e">10 s; any key stops it</text><text x="282" y="257" font-size="11.5" fill="#59636e">web page: Save, Install</text></g><g><rect x="516" y="184" width="220" height="92" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="528" y="206" font-size="13" font-weight="600" fill="#1f2328">30.6 s  boot_ram</text><text x="528" y="223" font-size="11.5" fill="#1f2328">base and size for the ROM,</text><text x="528" y="240" font-size="11.5" fill="#59636e">then a reset: the OS from RAM</text><text x="528" y="257" font-size="11.5" fill="#59636e">probe watch off for 2 s</text></g><g><rect x="24" y="312" width="220" height="92" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="334" font-size="13" font-weight="600" fill="#1f2328">31 s  OS in standby</text><text x="36" y="351" font-size="11.5" fill="#1f2328">its own PARMOD session</text><text x="36" y="368" font-size="11.5" fill="#59636e">modem firmware download</text><text x="36" y="385" font-size="11.5" fill="#59636e">any reset: back to 0 s</text></g><g><rect x="270" y="312" width="220" height="92" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="282" y="334" font-size="13" font-weight="600" fill="#1f2328">40 s  Power, dial</text><text x="282" y="351" font-size="11.5" fill="#1f2328">AT commands to the bridge</text><text x="282" y="368" font-size="11.5" fill="#59636e">CONNECT, PPP over WiFi</text><text x="282" y="385" font-size="11.5" fill="#59636e">(times: when we pressed)</text></g><g><rect x="516" y="312" width="220" height="92" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="528" y="334" font-size="13" font-weight="600" fill="#1f2328">57 s  WTVP</text><text x="528" y="351" font-size="11.5" fill="#1f2328">the service over TCP</text><text x="528" y="368" font-size="11.5" fill="#59636e">registration page</text><text x="528" y="385" font-size="11.5" fill="#59636e">REBOOT: no countdown next</text></g><text x="24" y="438" font-size="12" fill="#1f2328">Emulated times from power-on: boot ROM 3475, a fresh Bridge, build 16423, the firmware on the emulated</text><text x="24" y="456" font-size="12" fill="#1f2328">port. With WiFi saved the OS starts at 16 s (3475) or 12.8 s (2046 through tier 3).</text></svg>
