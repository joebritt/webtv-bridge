<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 512" role="img" aria-label="The diagnostics console: the box on nSelectIn, the Bridge on D7" font-size="13"><rect x="0" y="0" width="760" height="512" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">The diagnostics console: 19200 8N1, the box on nSelectIn, the Bridge on D7</text><defs><marker id="q-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fdb"/></marker></defs><g><text x="24" y="94" font-size="11.5" fill="#1f2328">nSelectIn (box)</text><text x="24" y="248" font-size="11.5" fill="#1f2328">D7 (Bridge)</text><text x="24" y="288" font-size="11.5" fill="#1f2328">Bridge drives (DIR)</text><text x="24" y="208" font-size="11.5" fill="#1f2328">nSelectIn (box)</text></g><g><path d="M160 80H196V100H196V100H232V100H268V100H304V100H340V100H376V80H412V100H448V80H484V100H520V80H556V80H736V80" fill="none" stroke="#1f2328" stroke-width="1.5"/><line x1="196" x2="196" y1="74" y2="106" stroke="#d0d7de"/><text x="214" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">start</text><line x1="232" x2="232" y1="74" y2="106" stroke="#d0d7de"/><text x="250" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">b0</text><line x1="268" x2="268" y1="74" y2="106" stroke="#d0d7de"/><text x="286" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">b1</text><line x1="304" x2="304" y1="74" y2="106" stroke="#d0d7de"/><text x="322" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">b2</text><line x1="340" x2="340" y1="74" y2="106" stroke="#d0d7de"/><text x="358" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">b3</text><line x1="376" x2="376" y1="74" y2="106" stroke="#d0d7de"/><text x="394" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">b4</text><line x1="412" x2="412" y1="74" y2="106" stroke="#d0d7de"/><text x="430" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">b5</text><line x1="448" x2="448" y1="74" y2="106" stroke="#d0d7de"/><text x="466" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">b6</text><line x1="484" x2="484" y1="74" y2="106" stroke="#d0d7de"/><text x="502" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">b7</text><line x1="520" x2="520" y1="74" y2="106" stroke="#d0d7de"/><text x="538" y="124" font-size="10.5" text-anchor="middle" fill="#59636e">stop</text><text x="566" y="66" font-size="12" font-weight="600" fill="#1f2328">P = 0x50, LSB first</text><text x="566" y="104" font-size="11.5" fill="#59636e">52.1 us a bit (19200 8N1)</text><text x="196" y="150" font-size="12" fill="#1f2328">The box sends a char: the Bridge samples mid-bit from the falling edge, as a UART does.</text></g><g><path d="M160 194H214V214H232V194H736V194" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="214" y="186" font-size="11" fill="#59636e">its last char ends</text><path d="M160 234H260V234H400V254H430V234H460V254H490V254H520V254H550V234H580V234H610V254H640V254H670V234H700V234H736V234" fill="none" stroke="#c4570f" stroke-width="1.5"/><path d="M160 294H400V274H700V294H736V294" fill="none" stroke="#c4570f" stroke-width="1.5"/><path d="M232 316H400" stroke="#2f6fdb" stroke-width="1.25" marker-end="url(#q-arrow)" marker-start="url(#q-arrow)"/><text x="252" y="334" font-size="11.5" font-weight="600" fill="#1f2328">1.5 ms with neither line moving</text><text x="252" y="350" font-size="11" fill="#59636e">(not to scale)</text><text x="712" y="226" font-size="12" font-weight="600" text-anchor="end" fill="#1f2328">1 = 0x31</text><text x="712" y="314" font-size="11.5" text-anchor="end" fill="#59636e">about 520 us</text></g><g><text x="24" y="388" font-size="12" fill="#1f2328">1  The box listens only inside its char-in, which polls D7 for a start bit for 1 ms; while it talks</text><text x="40" y="406" font-size="12" fill="#1f2328">it does not listen, and each char out starts with 520 us of idle line.</text><text x="24" y="428" font-size="12" fill="#1f2328">2  So the Bridge sends one char at a time, each once neither line has moved for 1.5 ms.</text><text x="24" y="450" font-size="12" fill="#1f2328">3  Its 161284 drives the bus only for that char (D7 the bit, D0-D6 low); the rest of the time</text><text x="40" y="468" font-size="12" fill="#1f2328">it listens, so it never fights the boot ROM driving the probe after a reset.</text><text x="24" y="490" font-size="12" fill="#1f2328">4  What the Bridge types: 18 or 19, sl (black), dr a8, stage 0 as sl lines, epc, g. Stage 0 is 122 words.</text></g></svg>
