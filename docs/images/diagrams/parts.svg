<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 560" role="img" aria-label="One cable: the Bridge gets in through the diagnostics, then carries everything over PARMOD" font-size="13"><rect x="0" y="0" width="760" height="560" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">One cable: the Bridge gets in through the diagnostics, then carries everything over PARMOD</text><defs><marker id="a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M134 168V200" marker-end="url(#a-arrow)"/><path d="M134 272V304" marker-end="url(#a-arrow)"/><path d="M248 132H312" marker-start="url(#a-arrow)" marker-end="url(#a-arrow)"/><path d="M526 168V184" marker-start="url(#a-arrow)" marker-end="url(#a-arrow)"/><path d="M134 408V440" marker-end="url(#a-arrow)"/><path d="M380 408V440" marker-start="url(#a-arrow)" marker-end="url(#a-arrow)"/><path d="M526 408V440" marker-start="url(#a-arrow)" marker-end="url(#a-arrow)"/><path d="M672 408V440" marker-start="url(#a-arrow)" marker-end="url(#a-arrow)"/></g><g><rect x="24" y="56" width="220" height="352" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="40" y="80" font-size="13" font-weight="600" fill="#1f2328">WebTV box (stock LC2)</text></g><g><rect x="40" y="96" width="188" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="52" y="120" font-weight="600" fill="#1f2328">Boot ROM</text><text x="52" y="136" font-size="11.5" fill="#1f2328">dongle probe, diagnostics,</text><text x="52" y="152" font-size="11.5" fill="#59636e">test 18 or 19</text></g><g><rect x="40" y="200" width="188" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/><text x="52" y="224" font-weight="600" fill="#1f2328">The bridge's loader</text><text x="52" y="240" font-size="11.5" fill="#1f2328">reads the OS, TV screens,</text><text x="52" y="256" font-size="11.5" fill="#59636e">boots it from RAM</text></g><g><rect x="40" y="304" width="188" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="52" y="328" font-weight="600" fill="#1f2328">WebTV OS, patched</text><text x="52" y="344" font-size="11.5" fill="#1f2328">modem and console</text><text x="52" y="360" font-size="11.5" fill="#59636e">on the parallel port</text></g><text x="280" y="118" font-size="11.5" text-anchor="middle" fill="#59636e">DB-25</text><text x="280" y="154" font-size="11.5" text-anchor="middle" fill="#59636e">straight</text><g><rect x="316" y="56" width="420" height="352" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="332" y="80" font-size="13" font-weight="600" fill="#1f2328">Bridge: Pico 2 W on parallel2usb</text></g><g><rect x="332" y="96" width="388" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="344" y="120" font-weight="600" fill="#1f2328">Core 1: the port engine, from RAM</text><text x="344" y="136" font-size="11.5" fill="#1f2328">probe watch; dongle mirror + 19200 serial; PARMOD</text><text x="344" y="152" font-size="11.5" fill="#59636e">answers every strobe within microseconds</text></g><text x="534" y="180" font-size="11" fill="#59636e">rings</text><g><rect x="332" y="184" width="388" height="208" rx="8" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 3"/><text x="344" y="204" font-size="12" font-weight="600" fill="#1f2328">Core 0: one polled loop</text></g><g><rect x="348" y="216" width="170" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="360" y="240" font-weight="600" fill="#1f2328">Start-up</text><text x="360" y="256" font-size="11.5" fill="#1f2328">loader, patch table,</text><text x="360" y="272" font-size="11.5" fill="#59636e">TV screens, tier 3</text></g><g><rect x="534" y="216" width="170" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="546" y="240" font-weight="600" fill="#1f2328">Modem, PPP, gateway</text><text x="546" y="256" font-size="11.5" fill="#1f2328">Hayes modem, PPP server,</text><text x="546" y="272" font-size="11.5" fill="#59636e">WTVP to the set server</text></g><g><rect x="348" y="304" width="170" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="360" y="328" font-weight="600" fill="#1f2328">Web page</text><text x="360" y="344" font-size="11.5" fill="#1f2328">state, box terminal,</text><text x="360" y="360" font-size="11.5" fill="#59636e">Save, Install; TCP 2323</text></g><g><rect x="534" y="304" width="170" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="546" y="328" font-weight="600" fill="#1f2328">Serial console</text><text x="546" y="344" font-size="11.5" fill="#1f2328">log, status, scan, wifi,</text><text x="546" y="360" font-size="11.5" fill="#59636e">service, type to the box</text></g><g><rect x="24" y="444" width="220" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="466" font-weight="600" fill="#1f2328">TV, remote, IR keyboard</text><text x="36" y="484" font-size="11.5" fill="#59636e">setup and menu screens</text></g><g><rect x="316" y="444" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="328" y="466" font-weight="600" fill="#1f2328">WebTV service</text><text x="328" y="484" font-size="11.5" fill="#59636e">over WiFi</text></g><g><rect x="462" y="444" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="474" y="466" font-weight="600" fill="#1f2328">A browser</text><text x="474" y="484" font-size="11.5" fill="#59636e">on the same LAN</text></g><g><rect x="608" y="444" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="620" y="466" font-weight="600" fill="#1f2328">A computer</text><text x="620" y="484" font-size="11.5" fill="#59636e">USB serial, 115200</text></g><text x="24" y="532" font-size="12" fill="#1f2328">The loader (highlighted) exists only between the diagnostics and the OS: it is how the Bridge gets in.</text></svg>
